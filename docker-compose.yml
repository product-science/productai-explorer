services:
  explorer:
    image: gcr.io/decentralized-ai/ping-pub-explorer:latest
    ports:
      - "5173:5173"  # Frontend
      - "${PROXY_PORT:-3000}:${PROXY_PORT:-3000}"  # Proxy server - uses PORT env var with 3000 as default
    environment:
      # Configure these for your Cosmos node
      - PROXY_HOST=http://127.0.0.1
      - PROXY_PORT=3000
      - API_ENDPOINT=http://genesis-node:1317
      - RPC_ENDPOINT=http://genesis-node:26657
    # For development with hot reload, you can uncomment these lines
    volumes:
      - ./src:/app/src
      - ./server:/app/server
    networks:
      - chain-public
    extra_hosts:
      - "host.docker.internal:host-gateway"  # For Docker to reach host machine services
    restart: unless-stopped

networks:
  chain-public:
   name: chain-public
